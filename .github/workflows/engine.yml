name: Edge Engine (scheduled mode)

# Use this while you don't have a server. It runs a full pass on a schedule, keeps the database in
# the repo, and publishes the results page and app data to GitHub Pages. Once the server is
# running, disable this workflow (Actions tab > this workflow > Disable).

on:
  schedule:
    # One run a day, in time for prime-time games. GitHub schedules are in UTC and can start
    # 10-20 minutes late, so the run is set for 5:30 PM Central to lock picks in before 6 PM tip-offs.
    # Two entries cover daylight saving time; the "Check time" step skips the one that doesn't match the current clock.
    - cron: "30 22 * * *"   # 5:30 PM Central in summer time (CDT)
    - cron: "30 23 * * *"   # 5:30 PM Central in winter time (CST)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: edge-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check time
        id: when
        run: |
          # Run the summer entry only during CDT and the winter entry only during CST, even if GitHub starts late.
          ZONE="$(TZ=America/Chicago date +%Z)"
          case "${{ github.event.schedule }}" in
            "30 22 * * *") [ "$ZONE" = "CDT" ] || SKIP=1 ;;
            "30 23 * * *") [ "$ZONE" = "CST" ] || SKIP=1 ;;
          esac
          if [ -n "$SKIP" ]; then echo "Daylight saving duplicate; skipping."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.when.outputs.skip != '1'
      - uses: actions/setup-python@v5
        if: steps.when.outputs.skip != '1'
        with:
          python-version: "3.12"
      - run: pip install ".[fast]"
        if: steps.when.outputs.skip != '1'
      - name: Run
        if: steps.when.outputs.skip != '1'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SPORTS: ${{ vars.SPORTS || 'nba nfl nhl' }} mlb
          ALT_LINES: ${{ vars.ALT_LINES }}
          BANKROLL: ${{ vars.BANKROLL }}
          EDGE_DB: data/edge.db
          PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/results.html
        run: |
          edge import-csv history/picks.csv   # keeps the old script's picks as a labeled legacy set (safe to repeat)
          # Load recent box scores (ESPN, free) for projections, learned correlations and player pages.
          # Games already stored are skipped, so after the first run this only adds the latest days.
          edge backfill --days 30 || true
          # Grade yesterday's games and refit the models first (box scores are free; no Odds API credits).
          edge grade && edge fit && edge backtest || true
          edge once --export site/index.json --results site/results.html
          mkdir -p data && cp site/index.json data/latest.json
          if [ -d assets ]; then cp assets/* site/; fi
          if [ -d web ]; then cp web/* site/; fi   # the Edge Finder app (app.html)
          cp site/results.html site/index.html
      - name: Save database
        if: steps.when.outputs.skip != '1'
        run: |
          git config user.name "edge-engine bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/edge.db data/latest.json
          git diff --cached --quiet || git commit -m "Engine run $(date -u +%FT%TZ)"
          git push
      - uses: actions/configure-pages@v5
        if: steps.when.outputs.skip != '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.when.outputs.skip != '1'
        with:
          path: site
      - id: deploy
        if: steps.when.outputs.skip != '1'
        uses: actions/deploy-pages@v4
